name: deploy

# Manual until the gallery exists (spec §9, phase 2). Enable Pages in repo
# settings and restore the push trigger at the same time — until then this
# would publish a bare index.json and keep the CI badge red.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Generate the uncommitted thumbnail variants
        run: npm run shoot -- --all
      - name: Build index
        run: npm run index
      # TODO(phase 2): build the gallery from site/ once it exists.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
